<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - English জানো</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#4338e8",
            blueText: "#0ea5e9"
          }
        }
      }
    }
  </script>
</head>

<body class="bg-white min-h-screen">
  <main class="w-full flex justify-center px-4 pt-4 pb-5">
    <div class="w-full max-w-[445px]">

      <div class="text-center mb-5">
        <h1 class="text-[27px] md:text-[30px] font-bold text-[#111827]">
          <span class="text-sky-500">Login</span> to Your Account
        </h1>
        <p class="mt-1 text-[14px] md:text-[15px] text-slate-500">
          আপনার অ্যাকাউন্টে প্রবেশ করুন এবং শিখতে থাকুন।
        </p>
      </div>

      <div class="border border-slate-200 rounded-md bg-white px-5 py-4 shadow-sm">
        <form id="loginForm">

          <div class="mb-4">
            <label for="username" class="flex items-center gap-2 mb-1.5 text-[13px] font-semibold text-[#243b63]">
              <svg class="w-5 h-5 text-blue-600" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/>
                <path d="M3 22a9 9 0 1 1 18 0H3Z"/>
              </svg>
              Email or Username
            </label>

            <input
              id="username"
              type="text"
              placeholder="আপনার ইমেইল বা ইউজারনেম লিখুন"
              class="w-full h-[34px] rounded-md border border-slate-300 px-3 text-[13px] text-slate-700 placeholder:text-slate-400 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-200"
            />
          </div>

          <div class="mb-4">
            <label for="password" class="flex items-center gap-2 mb-1.5 text-[13px] font-semibold text-[#243b63]">
              <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <rect x="5" y="10" width="14" height="11" rx="2"/>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
              </svg>
              Password
            </label>

            <div class="relative">
              <input
                id="password"
                type="password"
                placeholder="আপনার পাসওয়ার্ড লিখুন"
                class="w-full h-[34px] rounded-md border border-slate-300 px-3 pr-10 text-[13px] text-slate-700 placeholder:text-slate-400 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-200"
              />

              <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-600 hover:text-blue-600">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between mb-4">
            <label class="flex items-center gap-2 cursor-pointer text-[12px] font-medium text-slate-600">
              <input id="rememberMe" type="checkbox" class="w-4 h-4" />
              Remember Me
            </label>

            <a href="#" onclick="return false;" class="text-[12px] font-semibold text-blue-600 hover:text-blue-800">
              Forgot Password?
            </a>
          </div>

          <button
            type="submit"
            class="w-full h-[34px] rounded-md bg-gradient-to-r from-indigo-700 to-purple-700 text-white text-[14px] font-semibold flex items-center justify-center gap-2 shadow-sm hover:from-indigo-800 hover:to-purple-800 transition"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M10 17l5-5-5-5"/>
              <path d="M15 12H3"/>
              <path d="M21 3v18"/>
            </svg>
            Login
          </button>

          <div class="flex items-center gap-3 my-4">
            <div class="flex-1 h-px bg-slate-200"></div>
            <span class="text-[11px] text-slate-500">Don't have an account?</span>
            <div class="flex-1 h-px bg-slate-200"></div>
          </div>

          <a
            href="register.html"
            class="w-full h-[34px] rounded-md border border-indigo-500 bg-white text-indigo-600 text-[13px] font-semibold flex items-center justify-center gap-2 hover:bg-indigo-50 transition"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M15 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="8.5" cy="7" r="4"/>
              <path d="M19 8v6"/>
              <path d="M22 11h-6"/>
            </svg>
            Register Now
          </a>
        </form>
      </div>
    </div>
  </main>

  <script>
    // Already logged in হলে login page না দেখিয়ে index এ পাঠাবে
    if (localStorage.getItem("isLoggedIn") === "true") {
      window.location.replace("index.html");
    }

    function togglePassword() {
      const password = document.getElementById("password");
      password.type = password.type === "password" ? "text" : "password";
    }

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        alert("Username এবং Password দিন!");
        return;
      }

      localStorage.setItem("isLoggedIn", "true");
      localStorage.setItem("username", username);

      window.location.replace("index.html");
    });
  </script>
</body>
</html>
